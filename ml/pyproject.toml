[project]
name = "fire-ml"
version = "0.1.0"
description = "Контракт ML-модулей (активное горение, гари) и индексный baseline"
requires-python = ">=3.13"
dependencies = [
    "lightgbm>=4.7.0",
    "numpy>=2.5.3",
    "rasterio>=1.5.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fire_ml"]
