name: firewatch

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: firewatch-backend
  environment: &backend-env
    DATABASE_URL: postgresql+asyncpg://firewatch:${POSTGRES_PASSWORD:-firewatch}@postgres:5432/firewatch
    REDIS_URL: redis://redis:6379/0
    RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
    S3_ENDPOINT_URL: http://minio:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-firewatch}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-firewatch-secret}
    DATA_DIR: /data
    SEED_LIMIT_AF: ${SEED_LIMIT_AF:-0}
    SEED_LIMIT_BS: ${SEED_LIMIT_BS:-0}
    FIRE_ML_AF: ${FIRE_ML_AF:-fire_ml.baseline:BaselineActiveFire}
    FIRE_ML_BS: ${FIRE_ML_BS:-fire_ml.baseline:BaselineBurnSeverity}
    LLM_BASE_URL: ${LLM_BASE_URL:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-}
  restart: unless-stopped

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: firewatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firewatch}
      POSTGRES_DB: firewatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firewatch -d firewatch"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-05-24T17-08-30Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-firewatch}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-firewatch-secret}
    ports:
      - "9001:9001"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    <<: *backend
    command: ["python", "-m", "firewatch.worker"]
    deploy:
      replicas: ${WORKER_REPLICAS:-4}
    depends_on:
      api: { condition: service_healthy }

  seed:
    <<: *backend
    command: ["python", "-m", "firewatch.seed"]
    volumes:
      - ${DATA_PATH:-./DATA/fire-train-renamed/train}:/data:ro
    depends_on:
      api: { condition: service_healthy }
    restart: "no"

  web:
    build:
      context: frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  rabbitdata:
  s3data:
