[project]
name = "firewatch"
version = "0.1.0"
description = "Информационно-аналитический сервис мониторинга природных пожаров"
requires-python = ">=3.13"
dependencies = [
    "affine>=3.0.1",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.97",
    "fastapi>=0.141.1",
    "faststream[rabbit]>=0.7.5",
    "fire-ml",
    "fpdf2>=2.8.8",
    "geoalchemy2>=0.20.0",
    "geopandas>=1.1.4",
    "httpx>=0.28.1",
    "langchain>=1.4.1",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "python-multipart>=0.0.32",
    "rasterio>=1.5.1",
    "redis>=8.1.0",
    "scipy>=1.18.1",
    "shapely>=2.1.2",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firewatch"]

[tool.uv.sources]
fire-ml = { workspace = true }
